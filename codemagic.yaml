workflows:
  android-apk:
    name: Mushaf Android APK
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project if missing
        script: |
          set -e
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=mushaf_reader --no-pub .
          fi
      - name: Get dependencies
        script: flutter pub get
      - name: Build test APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

